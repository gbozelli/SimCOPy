# So os campos obrigatorios de um canal coerente. Tudo o que falta aqui deve sair
# com os padroes definidos em config/system.py e config/simulation.py.

system:
  channels:
    - {index: 0, kind: dcs, modulation: 16QAM, symbol_rate: 59.84e9, seed: 0}
  link:
    spans:
      - fiber: {length: 80.0e3}

simulation: {samples_per_symbol: 16, n_symbols: 1024}
