[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simcopy"
version = "0.1.0.dev0"
description = "Simulador modular de sistemas de comunicacoes opticas (WDM, IMDD e coerente digital)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0", "scipy>=1.11", "pyyaml>=6.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
dev = ["pytest", "ruff", "mypy", "import-linter"]

[project.scripts]
simcopy = "simcopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simcopy"]

[tool.pytest.ini_options]
# Testes ficam junto de cada modulo: src/simcopy/<modulo>/tests/.
testpaths = ["src"]
pythonpath = ["src"]
# io_test.py e rascunho e ainda nao roda; entra quando a issue de testes de io.py for feita.
addopts = "--ignore=src/simcopy/config/tests/io_test.py"

[tool.ruff]
line-length = 92

[tool.importlinter]
root_package = "simcopy"
[[tool.importlinter.contracts]]
# analysis (contas para graficos) so depende de core; plotting fica no topo: nenhum bloco,
# kernel ou pipeline importa matplotlib (CLAUDE.md, regra 6).
name = "Camadas: core < analysis < config < validation < kernels < components < pipelines < plotting"
type = "layers"
layers = ["simcopy.plotting", "simcopy.pipelines", "simcopy.components", "simcopy.kernels",
          "simcopy.validation", "simcopy.config", "simcopy.analysis", "simcopy.core"]
