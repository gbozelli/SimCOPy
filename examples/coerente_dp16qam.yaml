# Coerente digital, DP-16QAM, um canal, sem fibra, com os defeitos de transmissor do cenario do VPI
# (notebook 09). O oscilador local e outro laser, a 500 MHz, e o DSP usa os simbolos conhecidos.
# Rodar:  simcopy run examples/coerente_dp16qam.yaml -o resultados/dp16qam
# Unidades do SI. Guia: docs/sistema_coerente.md, secao 11.
system:
  center_frequency: 193.7e12
  channels:
    - index: 0
      kind: dcs
      modulation: 16QAM
      pol: DP
      symbol_rate: 59.84e9
      seed: 4
      launch_power_dbm: -20.0
      tx:
        laser: {power: 1.0e-3, linewidth: 500.0e3}
        mzm: {vpi: 5.0, vbias: 5.0, insertion_loss_db: 6.0, extinction_ratio_db: 30.0, s21_bandwidth: 40.0e9, s21_order: 3}
        iq: {phase_imbalance_deg: 5.0, skew: 0.75e-12}
        rolloff: 0.18
        pulse: root_raised_cosine
        drive_depth: 0.47
      rx:
        lo: {power: 1.0e-3, linewidth: 500.0e3}
        lo_frequency_offset: 500.0e6
        photodiode: {responsivity: 1.0, thermal_noise_density: 10.0e-12, shot_noise: true,
                     bandwidth_factor: 1.15, filter_type: bessel, filter_order: 4}
        dsp: {}
  link:
    spans: []
simulation:
  samples_per_symbol: 16
  n_symbols: 16384
  root_seed: 0
