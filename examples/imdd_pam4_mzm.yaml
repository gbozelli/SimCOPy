# IMDD com PAM4 e modulacao externa: laser CW -> MZM -> fibra -> fotodetector.
# Rodar:  simcopy run examples/imdd_pam4_mzm.yaml -o resultados/pam4
# Unidades do SI. Guia: docs/sistema_imdd.md, secao 11.

system:
  center_wavelength: 1550.0e-9
  channels:
    - index: 0
      kind: imdd
      modulation: PAM4                  # 2 bits por simbolo: 20 Gb/s a 10 GBd
      symbol_rate: 10.0e9
      seed: 1
      tx:
        driver: {filter_type: bessel, filter_order: 4, bandwidth_factor: 1.0}
        frontend:
          scheme: external
          laser: {power: 10.0e-3, linewidth: 500.0e3}
          mzm: {vpi: 5.0, vbias: 2.5, insertion_loss_db: 0.0, extinction_ratio_db: .inf}
          # Os quatro niveis eletricos sao igualmente espacados (0, 1/3, 2/3, 1) e a transmissao do
          # MZM e um cosseno ao quadrado. Com a excursao inteira (0,25) os niveis de potencia saem
          # em 0, 0,25, 0,75 e 1, com o olho do meio duas vezes maior que os outros. Com metade da
          # excursao (0,125) ficam em 0,15, 0,37, 0,63 e 0,85: olhos quase iguais, ao preco de o
          # nivel mais baixo nao chegar a zero.
          drive_amplitude: 0.125
      rx:
        photodiode: {responsivity: 1.0, thermal_noise_density: 10.0e-12, shot_noise: true,
                     bandwidth_factor: 1.15, filter_type: bessel, filter_order: 4}
  link:
    spans:
      - fiber: {length: 10.0e3, attenuation: 0.2e-3, dispersion: 16.0e-6}

simulation:
  samples_per_symbol: 16
  n_symbols: 4096
  root_seed: 1
